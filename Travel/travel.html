<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1 class="logo">Travelgo</h1>
        <ul class="menu">
            <li>Dashboard</li>
            <li>Bookings</li>
            <li>Favorites</li>
            <li>Settings</li>
        </ul>
    </nav>

    <section class="profile">
        <div class="top">
            <h3>Explore Destination</h3>
            <div class="searchbox">
                <input type="text" placeholder="Search places">
            </div>
            <h3>Hi your name!</h3>
        </div>

        <div class="choice">
            <button>Mountains</button>
            <button>Beaches</button>
            <button>Cities</button>
            <button>Forests</button>
        </div>
    </section>

    <section class="card">
        <div class="cardimage">
            <div class="imagebox">
                <img src="himalya.jpeg">
                <div class="price">$700</div>
            </div>
            <div class="card-content">
                <h2>Himalayas</h2>
                <p>India / Nepal</p>
            </div>
        </div>

        <div class="cardimage">
            <div class="imagebox">
                <img src="usa.jpeg">
                <div class="price">$950</div>
            </div>
            <div class="card-content">
                <h2>Yosemite Valley</h2>
                <p>USA</p>
            </div>
        </div>

        <div class="cardimage">
            <div class="imagebox">
                <img src="paris.jpeg">
                <div class="price">$900</div>
            </div>
            <div class="card-content">
                <h2>Paris</h2>
                <p>France</p>
            </div>
        </div>

        <div class="cardimage">
            <div class="imagebox">
                <img src="maldives.jpeg">
                <div class="price">$800</div>
            </div>
            <div class="card-content">
                <h2>Maldives</h2>
                <p>Tropical Beach</p>
            </div>
        </div>

    </section>
</body>
</html>
